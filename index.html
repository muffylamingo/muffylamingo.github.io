<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jolly Monkeys</title>
<meta name="description" content="Jolly Monkeys - independent games and apps.">
<style>
  :root { --bg: #0B0E16; --surface: #151A23; --text: #E8ECF1; --muted: #9AA4B5; --accent: #3DDC97; --border: #2A3140; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 48px 16px; }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 32px; margin: 0 0 4px; letter-spacing: 0.04em; }
  .sub { color: var(--muted); margin: 0 0 36px; }
  .app { display: flex; gap: 18px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; }
  .app img { width: 72px; height: 72px; border-radius: 18px; }
  .app h2 { margin: 0 0 4px; font-size: 20px; }
  .app p { margin: 0 0 6px; color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Jolly Monkeys</h1>
  <p class="sub">Independent games and apps · <a href="mailto:muffylagames@gmail.com">muffylagames@gmail.com</a></p>
  <div class="app">
    <img src="puzzleoon/icon.png" alt="Puzzleoon icon">
    <div>
      <h2>Puzzleoon</h2>
      <p>Logic puzzles with endless, verified boards.</p>
      <a href="puzzleoon/privacy.html">Privacy policy</a>
    </div>
  </div>
</main>
</body>
</html>
